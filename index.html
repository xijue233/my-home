<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>银湖万象装修进度及预算控制</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="银湖万象装修">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link href="https://cdn-font.hyperos.mi.com/font/css?family=MiSans:100,200,300,400,450,500,600,650,700,900:Chinese_Simplify,Latin&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --surface:#ffffff; --ink:#1c1b19; --ink-2:#6f6b63; --line:#e7e3da;
    --accent:#2f6f5e; --accent-soft:#e4efe9;
    --done:#3f7d4e; --todo:#a8a29a; --warn:#b06a1e; --danger:#b3261e;
    --hard:#2f6f5e; --soft:#c2863f;
    --radius:16px;
    --serif:"Fraunces","Songti SC",Georgia,serif;
    --sans:"MiSans","Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:15px}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 70px}

  /* masthead */
  .masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:30px 0 18px;border-bottom:1px solid var(--line)}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:clamp(23px,5.5vw,32px);letter-spacing:-.01em;line-height:1.12;margin:0}
  .meta{margin-top:10px;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:3px 16px}
  .meta .editable{border-bottom:1px dashed var(--line)}
  .sync{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap;padding-top:7px;font-weight:500}
  .sync .led{width:8px;height:8px;border-radius:50%;background:var(--done);transition:.3s}
  .sync.saving .led{background:var(--warn)} .sync.offline .led{background:var(--ink-2)}

  /* nav */
  .nav{display:flex;gap:30px;border-bottom:1px solid var(--line);margin:20px 0 4px}
  .nav button{background:none;border:none;padding:12px 0;font:600 15px var(--sans);color:var(--ink-2);cursor:pointer;position:relative}
  .nav button.active{color:var(--ink)}
  .nav button.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}

  .hint{font-size:12.5px;color:var(--ink-2);line-height:1.5}

  .panel{display:none} .panel.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .sec{display:flex;align-items:center;gap:12px;margin:32px 0 16px}
  .sec h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:0}
  .sec .rule{flex:1;height:1px;background:var(--line)}

  /* editable */
  .editable{outline:none;border-bottom:1px dashed transparent;cursor:text;padding:0 2px;border-radius:3px;transition:.12s}
  .editable:hover{border-bottom-color:var(--todo)}
  .editable:focus{border-bottom-color:var(--accent);background:rgba(47,111,94,.06)}

  /* stats */
  .stats{display:flex;margin:24px 0 4px}
  .stat{flex:1;padding:0 18px;border-left:1px solid var(--line)}
  .stat:first-child{border-left:none;padding-left:2px}
  .stat .num{font-family:var(--sans);font-size:clamp(26px,7vw,34px);font-weight:600;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .stat .num.warn{color:var(--danger)} .stat .num.now{color:var(--accent)}
  .stat .lbl{font-size:12px;color:var(--ink-2);margin-top:7px}

  /* timeline */
  .timeline{display:flex;flex-direction:column;gap:14px}
  .stage{display:flex;gap:16px}
  .rail{width:14px;display:flex;flex-direction:column;align-items:center;flex:0 0 14px}
  .dot{width:13px;height:13px;border-radius:50%;margin-top:22px;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
  .dot.done{background:var(--done);box-shadow:0 0 0 2px var(--done)}
  .dot.active{background:var(--accent);box-shadow:0 0 0 2px var(--accent);animation:pulse 1.9s infinite}
  .dot.todo{background:var(--todo);box-shadow:0 0 0 2px var(--todo)}
  @keyframes pulse{0%{box-shadow:0 0 0 2px var(--accent),0 0 0 6px rgba(47,111,94,.16)}70%{box-shadow:0 0 0 2px var(--accent),0 0 0 10px rgba(47,111,94,0)}100%{box-shadow:0 0 0 2px var(--accent),0 0 0 6px rgba(47,111,94,0)}}
  .vline{flex:1;width:2px;background:var(--line);margin:8px 0}

  .card{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--surface);transition:border-color .2s}
  .card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .card-name{font-weight:600;font-size:16px;display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .card-name .emo{font-size:18px}
  .nm-edit{outline:none;border-bottom:1px dashed transparent;cursor:text;border-radius:3px;padding:0 2px}
  .nm-edit:hover{border-bottom-color:var(--todo)} .nm-edit:focus{border-bottom-color:var(--accent);background:rgba(47,111,94,.06)}
  .head-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:0 0 auto}
  .badge{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px}
  .badge.done{background:#e8f1e9;color:var(--done)} .badge.active{background:var(--accent-soft);color:var(--accent)} .badge.todo{background:#f1efea;color:var(--todo)}

  .pbar{height:6px;background:#ececec;border-radius:99px;margin-top:12px;overflow:hidden}
  .pbar>i{display:block;height:100%;border-radius:99px;background:var(--done)}
  .pbar>i.active{background:var(--accent)}
  .pmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:6px}
  .range{width:100%;margin-top:9px;accent-color:var(--accent)}

  .stage-actions{display:flex;gap:5px}
  .iconbtn{width:27px;height:27px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;padding:0;transition:.12s}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
  .iconbtn.del:hover{border-color:var(--danger);color:var(--danger)}
  .iconbtn:disabled{opacity:.3;cursor:not-allowed}

  .details{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;display:none}
  .details.open{display:block}
  .dtag{font-size:12px;font-weight:700;margin:10px 0 5px;display:flex;align-items:center;gap:6px}
  .dtag.iss{color:var(--danger)} .dtag.sup{color:var(--warn)} .dtag.dec{color:var(--accent)}
  .addbtn{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:none;border-radius:8px;padding:3px 9px;cursor:pointer}
  .li{font-size:13.5px;color:#3a3833;padding:5px 0;display:flex;align-items:flex-start;gap:7px}
  .li:before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--line);margin-top:8px}
  .li.iss:before{background:var(--danger)} .li.sup:before{background:var(--warn)} .li.dec:before{background:var(--accent)}
  .li .txt{flex:1;outline:none;border-bottom:1px dashed transparent;min-height:1.2em;border-radius:3px;padding:0 2px}
  .li .txt:hover{border-bottom-color:var(--todo)} .li .txt:focus{border-bottom-color:var(--accent);background:rgba(47,111,94,.06)}
  .li .x{flex:0 0 auto;width:20px;height:20px;border:none;background:transparent;color:var(--ink-2);cursor:pointer;font-size:15px;line-height:1;border-radius:6px}
  .li .x:hover{color:var(--danger);background:#fbeceb}
  .empty{font-size:12.5px;color:var(--ink-2);padding:4px 0 4px 18px;font-style:italic}
  .toggle-hint{font-size:11.5px;color:var(--accent);margin-top:8px;font-weight:600;cursor:pointer}

  .add-stage{width:100%;margin-top:4px;padding:14px;border:1.5px dashed var(--line);background:transparent;border-radius:var(--radius);color:var(--accent);font-weight:600;cursor:pointer;font-size:14px;transition:.15s}
  .add-stage:hover{border-color:var(--accent);background:var(--accent-soft)}

  /* budget */
  .kpis{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
  .kpi{flex:1;min-width:130px;padding:17px 18px;border-left:1px solid var(--line)}
  .kpi:first-child{border-left:none}
  .kpi .num{font-family:var(--sans);font-size:clamp(19px,5vw,23px);font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
  .kpi .lbl{font-size:11.5px;color:var(--ink-2);margin-top:5px}
  .kpi.over .num{color:var(--danger)} .kpi.left .num{color:var(--done)} .kpi.used .num{color:var(--accent)}

  .split{display:flex;align-items:center;gap:22px;border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:var(--surface);flex-wrap:wrap}
  .donut-box{position:relative;width:128px;height:128px;flex:0 0 128px}
  .donut-box .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut-box .mid b{font-family:var(--sans);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums} .donut-box .mid small{font-size:10.5px;color:var(--ink-2)}
  .legend{font-size:13.5px;flex:1;min-width:180px}
  .legend .row{display:flex;align-items:center;gap:9px;margin:8px 0}
  .legend .sw{width:12px;height:12px;border-radius:3px}
  .legend .row b{margin-left:auto;font-variant-numeric:tabular-nums}

  .grp{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--surface)}
  .grp h3{margin:0 0 12px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .row-b{margin:13px 0}
  .row-b .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;gap:10px}
  .row-b .top .nm{font-weight:500}
  .row-b .top .vl{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .track{height:8px;background:#ececec;border-radius:99px;overflow:hidden}
  .track>i{display:block;height:100%;border-radius:99px}
  .fill-hard{background:var(--hard)} .fill-soft{background:var(--soft)} .fill-over{background:var(--danger)}
  .diff{font-size:11.5px;margin-top:5px;font-weight:600}
  .diff.up{color:var(--danger)} .diff.down{color:var(--done)} .diff.even{color:var(--ink-2)}

  .alert{border:1px solid #f0d4cf;border-radius:12px;padding:14px 16px;background:#fdf5f4}
  .alert .ttl{color:var(--danger);font-weight:700;font-size:13.5px;margin-bottom:8px;display:flex;gap:6px;align-items:center}
  .alert .it{font-size:13.5px;color:#7f1d1d;display:flex;justify-content:space-between;padding:4px 0}
  .alert .it b{font-variant-numeric:tabular-nums}

  .note{font-size:12px;color:var(--ink-2);background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px;line-height:1.65}
  .note b{color:#9a6a1c}

  /* 硬装付款计划 (3331) */
  .deal-line{font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .deal-line b{font-weight:600}
  .deal-line .save{font-size:12px;font-weight:600;color:var(--done);background:var(--accent-soft);padding:2px 9px;border-radius:999px}
  .plan{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
  .pm{border:1px solid var(--line);border-radius:12px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pm.paid{border-color:var(--done);background:#f3f8f4}
  .pm-top{display:flex;flex-direction:column;gap:2px;min-width:0}
  .pm-stage{font-weight:600;font-size:14px}
  .pm-amt{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .pm-paid{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .pm-paid input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .psum{font-size:13px;margin-top:10px;color:var(--ink-2)}
  .psum b{color:var(--ink);font-variant-numeric:tabular-nums}
  .sec-detail{border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
  .row-b.sm{margin:7px 0}
  .row-b.sm .top{margin-bottom:0}

  /* 软装内联数字输入 */
  .numin{width:74px;font:600 13px var(--sans);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--ink);background:#fff;text-align:right}
  .numin:focus{border-color:var(--accent);outline:none}
  .row-b .vl .numin + b, .row-b .vl{font-size:12.5px}

  .btn{font:600 13px var(--sans);padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger)}

  /* 装修需求 */
  .brief{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 6px}
  .brief .chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--surface);color:var(--ink-2)}
  .brief .chip b{color:var(--ink);font-weight:600}
  .req-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:680px){.req-grid{grid-template-columns:1fr}}
  .req-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--surface)}
  .req-head{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;margin-bottom:10px}
  .req-head .emo{font-size:18px}
  .req-name{outline:none;border-bottom:1px dashed transparent;cursor:text;border-radius:3px;padding:0 2px;font-weight:600;font-size:16px}
  .req-name:hover{border-bottom-color:var(--todo)} .req-name:focus{border-bottom-color:var(--accent);background:rgba(47,111,94,.06)}
  .req-block{margin:9px 0}
  .req-label{font-size:11.5px;font-weight:700;letter-spacing:.02em;margin-bottom:2px;color:var(--accent)}
  .req-label.soft{color:var(--soft)} .req-label.dev{color:var(--warn)} .req-label.pnt{color:#5b6b8a}
  .req-txt{font-size:13.5px;color:#3a3833;line-height:1.6;outline:none;border-bottom:1px dashed transparent;border-radius:3px;padding:0 2px}
  .req-txt:hover{border-bottom-color:var(--todo)} .req-txt:focus{border-bottom-color:var(--accent);background:rgba(47,111,94,.06)}
  .req-note{font-size:12px;color:var(--ink-2);background:var(--accent-soft);border-radius:10px;padding:8px 11px;margin-top:8px;line-height:1.55}
  .req-ref{margin-top:10px;border:1px dashed var(--line);border-radius:10px;height:74px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:12px;background:#fbfaf7}

  footer{text-align:center;color:var(--ink-2);font-size:11.5px;margin-top:34px}
  .backup-bar{display:flex;justify-content:center;gap:18px;margin-top:14px}
  .linkbtn{font:600 12.5px var(--sans);color:var(--accent);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer;transition:.12s}
  .linkbtn:hover{background:var(--accent-soft)}
  @media (max-width:560px){
    .stats{margin-top:20px} .stat{padding:0 12px}
    .split{flex-direction:column;text-align:center}
    .donut-box{width:120px;height:120px;flex-basis:120px}
    .kpi{min-width:50%}
    .masthead{flex-direction:column}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <h1>银湖万象装修进度及预算控制</h1>
      <div class="meta" id="pSub"></div>
    </div>
    <div class="sync" id="sync"><span class="led"></span><span id="syncTxt">同步中…</span></div>
  </header>

  <nav class="nav">
    <button class="active" data-tab="progress">装修进度</button>
    <button data-tab="budget">装修预算</button>
    <button data-tab="req">装修需求</button>
  </nav>

  <!-- 进度 -->
  <section class="panel active" id="panel-progress">
    <div class="stats">
      <div class="stat"><div class="num now" id="curStage">—</div><div class="lbl">当前阶段</div></div>
      <div class="stat"><div class="num" id="overall">0%</div><div class="lbl">整体进度</div></div>
      <div class="stat"><div class="num warn" id="issueCnt">0</div><div class="lbl">待解决问题</div></div>
    </div>

    <div class="sec"><h2>施工流程</h2><span class="rule"></span></div>
    <div class="timeline" id="timeline"></div>
    <button class="add-stage" onclick="addStage()">＋ 添加新阶段</button>
  </section>

  <!-- 预算 -->
  <section class="panel" id="panel-budget">
    <div class="kpis" id="kpis"></div>

    <div class="sec"><h2>资金构成</h2><span class="rule"></span></div>
    <div class="split">
      <div class="donut-box"><div id="donut"></div><div class="mid"><b id="donutTotal">—</b><small>总预算</small></div></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="sec"><h2>硬装 · 付款进度</h2><span class="rule"></span></div>
    <div class="grp" id="hardList"></div>

    <div class="sec"><h2>软装 · 预算执行</h2><span class="rule"></span></div>
    <div class="grp" id="softList"></div>

    <div class="sec"><h2>临时记账 · 其他支出</h2><span class="rule"></span></div>
    <div class="grp" id="extraList"></div>
    <button class="add-stage" onclick="addExtra()">＋ 记一笔</button>

    <div class="sec"><h2>超支预警</h2><span class="rule"></span></div>
    <div id="alertBox"></div>

    <div class="note"><b>说明：</b>硬装成交价 <b>¥88,800</b>（装修公司定价），总预算 <b>¥200,000</b>，剩余约 <b>¥111,200</b> 用于软装。硬装付款按计划节点填「实付」金额即可记账；软装每行「预算 / 实际」可改，自动算超支或结余；下方「临时记账」可记录计划外的新增花费，自动计入总支出。</div>
  </section>

  <!-- 装修需求 -->
  <section class="panel" id="panel-req">
    <div class="sec"><h2>基本情况</h2><span class="rule"></span></div>
    <div class="brief" id="brief"></div>

    <div class="sec"><h2>各功能区详细需求</h2><span class="rule"></span></div>
    <div class="req-grid" id="reqGrid"></div>
    <button class="add-stage" onclick="addArea()">＋ 添加功能区</button>
  </section>

  <div class="backup-bar">
    <button class="linkbtn" onclick="exportBackup()">⬇ 导出备份</button>
    <label class="linkbtn">⬆ 导入备份<input type="file" accept="application/json,.json" onchange="importBackup(this.files[0]);this.value=''" hidden></label>
  </div>
  <footer>本机自动保存 · 换设备请用「导出备份 / 导入备份」迁移数据</footer>
</div>

<script>
/* ===================== 装修需求（来自 PDF 初版，云端同步） ===================== */
const REQUIREMENTS = [
  { icon:"🚪", name:"入户过道", ref:"参考图（待补充）",
    scene:"进门换鞋、放钥匙 / 雨伞 / 快递、狗狗擦脚；女生临时放包包和帽子",
    furniture:"成品鞋柜、全身镜、靠墙置物架或洞洞板",

/* ---- 本地缓存：打开即显示上次同步好的页面，无需等待云端 ---- */
const CACHE_KEY = "xijue_board_cache_v1";
function cacheNow(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(serialize())); }catch(e){} }
function normalizeHardPlan(){
  (DATA.hard.plan||[]).forEach(m=>{ if(m.paidAmt===undefined) m.paidAmt = m.paid ? Math.round((DATA.hard.deal||0)*(m.pct||0)/100) : 0; });
}
function normalizeData(d){
  d = d || {};
  if(!d.project) d.project = { name:"银湖万象装修进度及预算控制", address:"银湖万象 6 栋", area:"98㎡", start:"", expectedEnd:"" };
  if(!Array.isArray(d.stages)) d.stages = [];
  if(!Array.isArray(d.requirements)) d.requirements = REQUIREMENTS.map(x=>({...x}));
  if(!d.hard) d.hard = { quote:98586, deal:90000, plan:[], sections:[] };
  if(!Array.isArray(d.hard.plan)) d.hard.plan = [];
  if(!d.soft) d.soft = { furniture:[], appliance:[] };
  if(!Array.isArray(d.soft.furniture)) d.soft.furniture = [];
  if(!Array.isArray(d.soft.appliance)) d.soft.appliance = [];
  if(typeof d.total!=="number") d.total = 200000;
  if(!Array.isArray(d.extra)) d.extra = [];
  return d;
}
(function loadCache(){
  try{
    const c = localStorage.getItem(CACHE_KEY);
    if(c){
      const o = JSON.parse(c);
      if(o && o.project){
        DATA = normalizeData(o);
        normalizeHardPlan();
        localUpdatedAt = o.updatedAt || 0;
        firstLoad = false;
      }
    }
  }catch(e){}
})();

/* ===================== 云端同步 ===================== */
/* ---- 纯本地模式：数据存浏览器本机，用「导出/导入备份」在设备间迁移（不连任何云端） ---- */

let saveTimer = null;

function serialize(){ return { project:DATA.project, stages:DATA.stages, hard:DATA.hard, soft:DATA.soft, requirements:DATA.requirements, total:DATA.total, extra:DATA.extra, updatedAt:Date.now() }; }
function editing(){ const a=document.activeElement; return a && a.isContentEditable; }
function setSync(state){
  const el=$("#sync"), t=$("#syncTxt");
  el.classList.remove("saving","offline");
  if(state==="saving"){ el.classList.add("saving"); t.textContent="保存中…"; }
  else if(state==="offline"){ el.classList.add("offline"); t.textContent="本机模式（未连云端）"; }
  else { t.textContent="已同步"; }
}
async function push(){ cacheNow(); setSync("offline"); }   /* 本机保存，状态显示「本机模式」 */
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(push,500); }

async function pull(){ firstLoad=false; setSync("offline"); }   /* 纯本地：无云端可拉 */

/* 导出 / 导入备份：云端不可用时，用文件在设备间迁移数据 */
function exportBackup(){
  try{
    const blob = new Blob([JSON.stringify(serialize(),null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    const pad = n => String(n).padStart(2,"0");
    a.href = url;
    a.download = `装修看板备份_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    a.click(); URL.revokeObjectURL(url);
    alert("已导出备份文件，可发到另一台设备用「导入备份」恢复。");
  }catch(e){ alert("导出失败：" + e.message); }
}
function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const o = JSON.parse(reader.result);
      applyData(normalizeData(o));
      renderAll(); cacheNow();
      alert("已导入备份，本机数据已更新。" + (DATA.extra&&DATA.extra.length?"":"") );
    }catch(e){ alert("导入失败：文件格式不正确。"); }
  };
  reader.readAsText(file);
}

function applyData(d){
  if(d.project)DATA.project=d.project;
  if(Array.isArray(d.stages))DATA.stages=d.stages.map(({status, ...rest})=>rest);
  if(d.hard)DATA.hard=d.hard;
  if(d.soft){ if(!Array.isArray(d.soft.furniture))d.soft.furniture=[]; if(!Array.isArray(d.soft.appliance))d.soft.appliance=[]; DATA.soft=d.soft; }
  if(Array.isArray(d.requirements))DATA.requirements=d.requirements;
  if(typeof d.total==="number")DATA.total=d.total;
  if(Array.isArray(d.extra))DATA.extra=d.extra;
  DATA.stages.forEach(s=>{ if(s.open===undefined)s.open=false; });
  normalizeHardPlan();
  cacheNow();
}

/* 状态由进度百分比推导：0% = 未开始，100% = 已完成，其余 = 进行中 */
const stageStatus = s => { const p = s.progress||0; return p>=100 ? "done" : p>0 ? "active" : "todo"; };

/* ===================== 渲染 ===================== */
const fmt = n => "¥" + Math.round(n).toLocaleString("zh-CN");
const $ = s => document.querySelector(s);

function renderHeader(){
  const f=[["address","地址"],["area","面积"],["start","开工"],["expectedEnd","预计完工"]];
  $("#pSub").innerHTML = f.map(([k,l])=>`<span>${l} · <span class="editable" contenteditable="true" data-field="${k}">${DATA.project[k]||"待填写"}</span></span>`).join("");
}
const LIST_TITLE=k=>k==="issues"?"当前问题 / 注意事项":k==="support"?"需要支持 / 协调":"本阶段需确定的家具电器";
const LIST_CLS=k=>k==="issues"?"iss":k==="support"?"sup":"dec";

function renderProgress(){
  const st=DATA.stages;
  const cur=st.find(s=>stageStatus(s)==="active")||st.find(s=>stageStatus(s)!=="done");
  $("#curStage").textContent=cur?cur.name:"已完工";
  $("#overall").textContent=Math.round(st.reduce((a,s)=>a+(s.progress||0),0)/st.length)+"%";
  $("#issueCnt").textContent=st.reduce((a,s)=>a+(s.issues?s.issues.length:0),0);

  $("#timeline").innerHTML=st.map((s,i)=>{
    const badge=stageStatus(s)==="done"?`<span class="badge done">已完成</span>`:stageStatus(s)==="active"?`<span class="badge active">进行中</span>`:`<span class="badge todo">未开始</span>`;
    const act=`<div class="stage-actions">
        <button class="iconbtn" title="上移" ${i===0?"disabled":""} onclick="moveStage(${i},-1)">↑</button>
        <button class="iconbtn" title="下移" ${i===st.length-1?"disabled":""} onclick="moveStage(${i},1)">↓</button>
        <button class="iconbtn del" title="删除" onclick="delStage(${i})">✕</button></div>`;
    const pbar=`
      <div class="pbar"><i class="${stageStatus(s)==='active'?'active':''}" id="pf${i}" style="width:${s.progress||0}%"></i></div>
      <div class="pmeta"><span>进度</span><span id="pn${i}">${s.progress||0}%</span></div>
      <input class="range" type="range" min="0" max="100" value="${s.progress||0}" oninput="setProg(${i},this.value)" onchange="scheduleSave()" />`;
    const lists=["issues","support","decisions"].map(k=>block(k,s[k],i)).join("");
    const det=`<div class="details ${s.open?"open":""}"><div>${lists}</div>
        <div class="toggle-hint" onclick="toggle(${i})">${s.open?"▴ 收起明细":"▾ 展开明细（问题 / 支持 / 需确定）"}</div></div>`;
    const hint=s.open?"":`<div class="toggle-hint" onclick="toggle(${i})">▾ 展开明细（问题 / 支持 / 需确定）</div>`;
    return `<div class="stage">
      <div class="rail"><div class="dot ${stageStatus(s)}"></div><div class="vline"></div></div>
      <div class="card ${stageStatus(s)==='active'?'active':''}">
        <div class="card-head">
          <div class="card-name"><span class="emo">${s.icon}</span><span class="nm-edit" contenteditable="true" data-stage="${i}">${s.name}</span></div>
          <div class="head-right">${badge}${act}</div>
        </div>
        ${pbar}${det}${hint}
      </div></div>`;
  }).join("");
}
function block(k,arr,i){
  const cls=LIST_CLS(k);
  let body = (!arr||!arr.length) ? `<div class="empty">暂无</div>`
    : arr.map((x,j)=>`<div class="li ${cls}"><span class="txt" contenteditable="true" data-stage="${i}" data-list="${k}" data-idx="${j}">${x}</span><button class="x" onclick="delItem(${i},'${k}',${j})" title="删除">×</button></div>`).join("");
  return `<div class="dtag ${cls}">${LIST_TITLE(k)}<button class="addbtn" onclick="addItem(${i},'${k}')">＋ 添加</button></div>${body}`;
}
function hardPaid(){ return DATA.hard.plan.reduce((a,m)=>a+(m.paidAmt||0),0); }

function renderTotals(){
  const h=DATA.hard;
  const hp=hardPaid();
  const soft=[...DATA.soft.furniture,...DATA.soft.appliance];
  const sb=soft.reduce((a,x)=>a+x.budget,0), sa=soft.reduce((a,x)=>a+x.actual,0);
  const ex=(DATA.extra||[]).reduce((a,x)=>a+(x.amount||0),0);
  const total=DATA.total||0, used=hp+sa+ex, left=total-used;

  $("#kpis").innerHTML=[{c:"",l:"总预算",n:fmt(total)},{c:"used",l:"已支出",n:fmt(used)},
    {c:"left",l:"剩余",n:fmt(left)},{c:left<0?"over":"left",l:"总体结余",n:(left<0?"超 ":"省 ")+fmt(Math.abs(left))}]
    .map(k=>`<div class="kpi ${k.c}"><div class="num">${k.n}</div><div class="lbl">${k.l}</div></div>`).join("");

  const hpPct=total?Math.round(h.deal/total*100):0, C=2*Math.PI*52;
  const hardLen=C*hpPct/100, softLen=C*(total?Math.round(sb/total*100):0)/100;
  $("#donut").innerHTML=`<svg width="128" height="128" viewBox="0 0 120 120" style="transform:rotate(-90deg)">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#ececec" stroke-width="13"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--hard)" stroke-width="13" stroke-dasharray="${hardLen} ${C-hardLen}"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--soft)" stroke-width="13" stroke-dasharray="${softLen} ${C-softLen}" stroke-dashoffset="${-hardLen}"/>
    </svg>`;
  $("#donutTotal").textContent=fmt(total);
  $("#legend").innerHTML=`<div class="row"><span class="sw" style="background:var(--hard)"></span>硬装（成交价）<b>${fmt(h.deal)}</b></div>
    <div class="row"><span class="sw" style="background:var(--soft)"></span>软装（家具/电器）<b>${fmt(sb)}</b></div>
    <div class="row" style="margin-top:10px;color:var(--ink-2);font-size:12px">硬装已付 ${fmt(hp)} · 待付 ${fmt(h.deal-hp)} ｜ 报价 ${fmt(h.quote)}</div>`;

  const over=soft.filter(x=>x.actual>x.budget);
  $("#alertBox").innerHTML=over.length?`<div class="alert"><div class="ttl">⚠️ 以下项目已超支</div>`+over.map(x=>`<div class="it"><span>${x.name}</span><b>超 ${fmt(x.actual-x.budget)}</b></div>`).join("")+`</div>`
    :`<div class="alert"><div class="ttl">✅ 暂无超支</div><div class="it">目前所有已支出项都在预算内。</div></div>`;
}

function renderBudget(){
  const h=DATA.hard;
  const hp=hardPaid();
  const paidPct=h.deal?Math.round(hp/h.deal*100):0;

  const planHtml=h.plan.map((m,i)=>{
    const amt=Math.round(h.deal*m.pct/100);
    const pa=m.paidAmt||0;
    const done=pa>=amt, part=pa>0&&!done;
    const st=done?"已付清":part?"部分支付":"未付";
    const badge=done?"done":part?"active":"todo";
    return `<div class="pm ${done?'paid':''}">
      <div class="pm-top"><span class="pm-stage">${m.stage}</span><span class="pm-amt">计划 ${fmt(amt)}</span>
        <span class="pm-amt" style="margin-left:6px">实付 <input class="numin" type="number" min="0" value="${pa}" oninput="setPaidAmt(${i},this.value)" onchange="renderBudget()" style="width:88px"></span></div>
      <span class="badge ${badge}">${st}</span>
    </div>`;
  }).join("");
  const secHtml=h.sections.map(s=>`<div class="row-b sm"><div class="top"><span class="nm">${s.name}</span><span class="vl">${fmt(s.quote)}</span></div></div>`).join("");

  $("#hardList").innerHTML=`
    <div class="deal-line">报价 <b>${fmt(h.quote)}</b> → 成交价 <input class="numin" type="number" min="0" value="${h.deal}" oninput="setDeal(this.value)" onchange="renderBudget()" style="width:96px;font-weight:600"> <span class="save">立省 ${fmt(h.quote-h.deal)}</span></div>
    <div class="pbar" style="margin:12px 0 14px"><i id="hardBar" style="width:${paidPct}%"></i></div>
    <div class="plan">${planHtml}</div>
    <div class="psum" id="psumTxt">已付 <b>${fmt(hp)}</b> / 成交价 ${fmt(h.deal)} · 待付 <b>${fmt(h.deal-hp)}</b></div>
    <div class="toggle-hint" onclick="toggleSec(this)">▾ 展开报价明细（${h.sections.length} 项）</div>
    <div class="sec-detail" id="secDetail" style="display:none">${secHtml}</div>`;

  const rs=(t,arr,key)=>`<h3>${t}</h3>`+arr.map((x,j)=>{
    const exec = x.budget ? Math.round(x.actual/x.budget*100) : 0;
    const overPct = x.budget ? Math.round((x.actual-x.budget)/x.budget*100) : 0;
    const d=x.budget-x.actual, cls=d<0?"up":(d>0&&x.actual>0?"down":"even");
    const txt = x.actual===0 ? "未支出" : d<0 ? `超支 ${fmt(-d)} · 超 ${overPct}%` : `结余 ${fmt(d)} · 用 ${exec}%`;
    const barW = x.budget ? Math.min(100, exec) : 0;
    const barCls = d<0 ? "fill-over" : "fill-soft";
    return `<div class="row-b">
      <div class="top"><span class="nm"><span class="txt" contenteditable="true" data-soft="${key}" data-idx="${j}">${x.name}</span></span>
        <span class="vl">预算 <input class="numin" type="number" min="0" value="${x.budget}" oninput="softInput('${key}',${j},'budget',this.value)" onchange="renderBudget()"> · 实际 <input class="numin" type="number" min="0" value="${x.actual}" oninput="softInput('${key}',${j},'actual',this.value)" onchange="renderBudget()"></span></div>
      <div class="track"><i class="${barCls}" style="width:${barW}%"></i></div>
      <div class="diff ${cls}">${txt}</div>
    </div>`;
  }).join("");
  $("#softList").innerHTML=rs("🪑 家具",DATA.soft.furniture,"furniture")+rs("🔌 电器",DATA.soft.appliance,"appliance");

  $("#extraList").innerHTML = (DATA.extra&&DATA.extra.length) ? DATA.extra.map((x,j)=>`
    <div class="row-b">
      <div class="top"><span class="nm"><span class="txt" contenteditable="true" data-extra="${j}">${x.name||""}</span></span>
        <span class="vl">金额 <input class="numin" type="number" min="0" value="${x.amount||0}" oninput="extraInput(${j},this.value)" onchange="renderBudget()"></span>
        <button class="iconbtn del" title="删除" onclick="delExtra(${j})">✕</button></div>
    </div>`).join("") : `<div class="empty">暂无临时记账，点下方「＋ 记一笔」记录计划外花费</div>`;

  renderTotals();
}

function setPaidAmt(i,v){ DATA.hard.plan[i].paidAmt=Math.max(0,parseFloat(v)||0); scheduleSave(); renderTotals(); updateHardLive(); }
function setDeal(v){ DATA.hard.deal=Math.max(0,parseFloat(v)||0); scheduleSave(); renderTotals(); updateHardLive(); }
function updateHardLive(){
  const h=DATA.hard, hp=hardPaid(), paidPct=h.deal?Math.round(hp/h.deal*100):0;
  const bar=$("#hardBar"); if(bar)bar.style.width=paidPct+"%";
  const ps=$("#psumTxt"); if(ps)ps.innerHTML=`已付 <b>${fmt(hp)}</b> / 成交价 ${fmt(h.deal)} · 待付 <b>${fmt(h.deal-hp)}</b>`;
}
function softInput(key,j,field,val){ DATA.soft[key][j][field]=Math.max(0,parseFloat(val)||0); scheduleSave(); renderTotals(); }
function toggleSec(el){ const d=$("#secDetail"); const open=d.style.display!=="none"; d.style.display=open?"none":"block"; el.textContent=open?`▾ 展开报价明细（${DATA.hard.sections.length} 项）`:`▴ 收起报价明细`; }
function renderAll(){ renderHeader(); renderProgress(); renderBudget(); renderReq(); }

const REQ_FIELD = t => t==="需求场景"?"scene":t==="涉及家具 / 软装"?"furniture":t==="电器 / 设备"?"device":"points";
function renderReq(){
  const base=[["建筑面积","98㎡"],["室内面积","80㎡"],["户型","三室一厅"],["居住对象","2 人 + 1 猫 + 1 狗"],["楼层","1 楼西户"]];
  $("#brief").innerHTML=base.map(([k,v])=>`<span class="chip">${k} · <b>${v}</b></span>`).join("");
  const arr=DATA.requirements;
  $("#reqGrid").innerHTML=arr.map((r,i)=>{
    const labels=[["需求场景",r.scene],["涉及家具 / 软装",r.furniture,"soft"],["电器 / 设备",r.device,"dev"],["水电点位",r.points,"pnt"]];
    const blocks=labels.map(([t,c,cls])=>`<div class="req-block"><div class="req-label ${cls||''}">${t}</div><div class="req-txt" contenteditable="true" data-req="${i}" data-reqfield="${REQ_FIELD(t)}">${c||""}</div></div>`).join("");
    const note=r.note?`<div class="req-note">备注：<span class="req-txt" contenteditable="true" data-req="${i}" data-reqfield="note">${r.note}</span></div>`:"";
    const ref=r.ref?`<div class="req-ref">📷 ${r.ref}</div>`:"";
    const del=`<button class="iconbtn del" title="删除" onclick="delArea(${i})" style="margin-left:auto">✕</button>`;
    return `<div class="req-card"><div class="req-head"><span class="emo">${r.icon}</span><span class="req-name" contenteditable="true" data-req="${i}" data-reqfield="name">${r.name}</span>${del}</div>${blocks}${note}${ref}</div>`;
  }).join("");
}

/* ===================== 编辑操作 ===================== */
function toggle(i){ DATA.stages[i].open=!DATA.stages[i].open; scheduleSave(); renderProgress(); }
function setProg(i,v){ DATA.stages[i].progress=+v; const f=$("#pf"+i),n=$("#pn"+i); if(f)f.style.width=v+"%"; if(n)n.textContent=v+"%"; }
function moveStage(i,d){ const j=i+d; if(j<0||j>=DATA.stages.length)return; const t=DATA.stages[i];DATA.stages[i]=DATA.stages[j];DATA.stages[j]=t; scheduleSave(); renderProgress(); }
function delStage(i){ if(confirm("确定删除「"+DATA.stages[i].name+"」这个阶段？")){ DATA.stages.splice(i,1); scheduleSave(); renderProgress(); } }
function addStage(){ DATA.stages.push({name:"新阶段",icon:"📌",progress:0,open:true,issues:[],support:[],decisions:[]}); scheduleSave(); renderProgress(); const el=document.querySelector('.nm-edit[data-stage="'+(DATA.stages.length-1)+'"]'); if(el){el.focus();document.getSelection().selectAllChildren(el);} }
function addArea(){ DATA.requirements.push({icon:"📋",name:"新功能区",scene:"",furniture:"",device:"",points:"",note:"",ref:""}); scheduleSave(); renderReq(); const el=document.querySelector('.req-name[data-req="'+(DATA.requirements.length-1)+'"]'); if(el){el.focus();document.getSelection().selectAllChildren(el);} }
function delArea(i){ if(confirm("确定删除「"+DATA.requirements[i].name+"」这个功能区？")){ DATA.requirements.splice(i,1); scheduleSave(); renderReq(); } }
function extraInput(j,v){ DATA.extra[j].amount=Math.max(0,parseFloat(v)||0); scheduleSave(); renderTotals(); }
function addExtra(){ if(!DATA.extra)DATA.extra=[]; DATA.extra.push({name:"新增支出",amount:0}); scheduleSave(); renderBudget(); const el=document.querySelector('.txt[data-extra="'+(DATA.extra.length-1)+'"]'); if(el){el.focus();document.getSelection().selectAllChildren(el);} }
function delExtra(j){ DATA.extra.splice(j,1); scheduleSave(); renderBudget(); }
function addItem(i,k){ DATA.stages[i][k].push(""); scheduleSave(); renderProgress(); const a=DATA.stages[i][k]; const el=document.querySelector('.txt[data-stage="'+i+'"][data-list="'+k+'"][data-idx="'+(a.length-1)+'"]'); if(el)el.focus(); }
function delItem(i,k,j){ DATA.stages[i][k].splice(j,1); scheduleSave(); renderProgress(); }

document.addEventListener("blur",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.field){ DATA.project[t.dataset.field]=t.textContent.trim(); scheduleSave(); }
  else if(t.classList&&t.classList.contains("nm-edit")){ DATA.stages[+t.dataset.stage].name=t.textContent.trim(); scheduleSave(); }
  else if(t.dataset&&t.dataset.soft!==undefined){ DATA.soft[t.dataset.soft][+t.dataset.idx].name=t.textContent.trim(); scheduleSave(); }
  else if(t.dataset&&t.dataset.list!==undefined){ DATA.stages[+t.dataset.stage][t.dataset.list][+t.dataset.idx]=t.textContent.trim(); scheduleSave(); }
  else if(t.dataset&&t.dataset.req!==undefined){ const i=+t.dataset.req, f=t.dataset.reqfield; if(f)DATA.requirements[i][f]=t.textContent.trim(); scheduleSave(); }
  else if(t.dataset&&t.dataset.extra!==undefined){ DATA.extra[+t.dataset.extra].name=t.textContent.trim(); scheduleSave(); }
  },true);
document.addEventListener("keydown",e=>{ if(e.target.isContentEditable&&e.key==="Enter"){ e.preventDefault(); e.target.blur(); } });

/* tab */
document.querySelectorAll(".nav button").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); $("#panel-"+t.dataset.tab).classList.add("active");
}));

/* 启动：先渲染默认，再拉云端；之后每 8 秒 + 回到页面时刷新 */
renderAll();
pull();
setInterval(pull,8000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pull(); });
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
